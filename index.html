function homeOld(){const u=me();const cats=[...new Set(courses.map(c=>c.cat))];const f=V.x||"All";
 return `<h2>Hi ${esc(u.name)} 👋</h2><div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px">${["All",...cats].map(c=>`<button class="${c===f?"":"g"}" onclick="go('home','${esc(c)}')">${esc(c)}</button>`).join("")}</div>
 <div class="grid">${courses.filter(c=>f==="All"||c.cat===f).map(c=>{const d=done(u,c),t=c.lessons.length||1;return `<div class="card"><span class="tag">${esc(c.cat)}</span><h3>${esc(c.title)}</h3><p class="mu">${c.lessons.length} lessons</p><div class="bar"><i style="width:${d/t*100}%"></i></div><p class="mu">${d}/${c.lessons.length} done</p><button onclick="go('course','${c.id}')">Open</button></div>`}).join("")||`<p class="mu">No courses yet.</p>`}</div>`}
function course(){const u=me(),c=courses.find(c=>c.id===V.x);if(!c)return home();const d=done(u,c);
 return `<button class="g" onclick="go('home')">← Back</button><h2>${esc(c.title)}</h2>
 ${c.lessons.map((l,i)=>{const s=u.prog[key(c.id,i)];return `<div class="card" style="display:flex;justify-content:space-between;align-items:center;gap:8px"><div><b>${i+1}. ${esc(l.t)}</b><div class="mu">${s!=null?"Best score: "+s+"%":"Not attempted"}</div></div><button onclick="go('lesson','${c.id}|${i}')">${s!=null?"Review":"Start"}</button></div>`}).join("")||`<p class="mu">No lessons yet.</p>`}
 ${c.lessons.length&&d===c.lessons.length?`<button onclick="go('cert','${c.id}')">🎓 Get certificate</button>`:""}`}
function lesson(){const[cid,i]=V.x.split("|"),c=courses.find(c=>c.id===cid),l=c.lessons[+i];
 return `<button class="g" onclick="go('course','${cid}')">← ${esc(c.title)}</button><h2>${esc(l.t)}</h2>
 <div class="card"><a class="btn g" href="${esc(l.v)}" target="_blank" rel="noopener">▶ Watch video</a> ${(l.l||[]).map(x=>`<a class="btn g" href="${esc(x[1])}" target="_blank" rel="noopener">${esc(x[0])}</a>`).join(" ")}<p>${esc(l.n)}</p></div>
 <div class="card"><h3>Quiz</h3><div id="qz">${l.q.map((q,k)=>`<div style="margin-bottom:12px"><b>${k+1}. ${esc(q.q)}</b>${q.o.map((o,j)=>`<label class="opt"><input type="radio" name="q${k}" value="${j}">${esc(o)}</label>`).join("")}</div>`).join("")}</div>
 <button onclick="submitQ('${cid}',${i})">Submit quiz</button><p id="res" style="font-weight:600"></p></div>`}
function submitQ(cid,i){const u=me(),l=courses.find(c=>c.id===cid).lessons[i];let ok=0;
 l.q.forEach((q,k)=>{const s=document.querySelector(`input[name=q${k}]:checked`);const labs=document.querySelectorAll(`input[name=q${k}]`);
  labs.forEach((r,j)=>{r.disabled=true;const p=r.parentElement;if(j===q.a)p.classList.add("ok");else if(s&&+s.value===j)p.classList.add("no")});
  if(s&&+s.value===q.a)ok++});
 const pct=Math.round(ok/l.q.length*100),k=key(cid,i);
 if(u.prog[k]==null)u.pts+=ok*10;u.prog[k]=Math.max(u.prog[k]||0,pct);
 const t=new Date(),td=t.toISOString().slice(0,10),y=new Date(t-864e5).toISOString().slice(0,10);
 if(u.last!==td){u.streak=u.last===y?u.streak+1:1;u.last=td}
 sv();$("#res").textContent=`Score: ${ok}/${l.q.length} (${pct}%) ${pct>=60?"✅ Passed":"❌ Need 60% to pass – review and retry"}`}
function dash(){const u=me();let tot=0,dn=0,sc=[];
 courses.forEach(c=>{tot+=c.lessons.length;dn+=done(u,c)});Object.values(u.prog).forEach(v=>sc.push(v));
 const avg=sc.length?Math.round(sc.reduce((a,b)=>a+b,0)/sc.length):0,pc=tot?Math.round(dn/tot*100):0;
 return `<h2>Dashboard</h2><div class="stats"><div class="card stat"><b>${pc}%</b>Progress</div><div class="card stat"><b>${avg}%</b>Avg score</div><div class="card stat"><b>🔥 ${u.streak}</b>Day streak</div><div class="card stat"><b>${u.pts}</b>Points</div></div>
 <div class="card"><h3>My courses</h3>${courses.filter(c=>c.lessons.some((_,i)=>u.prog[key(c.id,i)]!=null)).map(c=>{const d=done(u,c),t=c.lessons.length||1;return `<p><b>${esc(c.title)}</b> <span class="mu">${d}/${c.lessons.length}</span></p><div class="bar"><i style="width:${d/t*100}%"></i></div>${c.lessons.length&&d===c.lessons.length?`<p><button onclick="go('cert','${c.id}')">🎓 Certificate</button></p>`:""}`}).join("")}</div>`}
function board(){const r=[...users].filter(u=>!u.admin).sort((a,b)=>b.pts-a.pts);
 return `<h2>🏆 Leaderboard</h2><div class="card"><table><tr><th>#</th><th>Name</th><th>Points</th><th>Streak</th></tr>${r.map((u,i)=>`<tr><td>${i+1}</td><td>${esc(u.name)}</td><td>${u.pts}</td><td>🔥 ${u.streak}</td></tr>`).join("")||`<tr><td colspan="4" class="mu">No learners yet.</td></tr>`}</table><p class="mu">Shows learners on this browser/device.</p></div>`}
function cert(){const u=me(),c=courses.find(c=>c.id===V.x);
 return `<div class="np"><button class="g" onclick="go('dash')">← Back</button> <button onclick="window.print()">Print / Save PDF</button></div><br><div class="cert"><h1>Certificate of Completion</h1><p>This certifies that</p><h2>${esc(u.name)}</h2><p>has successfully completed</p><h2>${esc(c.title)}</h2><p class="mu">${new Date().toLocaleDateString()} · SkillSprint</p></div>`}
function admin(){const u=me();if(!u.admin)return home();
 return `<h2>Admin panel</h2><div class="card"><h3>Add course</h3><input id="ct" placeholder="Course title"><input id="cc" placeholder="Category (e.g. AI)"><button onclick="addC()">Add course</button></div>
 <div class="card"><h3>Add lesson with quiz question</h3><select id="lc">${courses.map(c=>`<option value="${c.id}">${esc(c.title)}</option>`).join("")}</select>
 <input id="lt" placeholder="Lesson title"><input id="lv" placeholder="Video URL (YouTube link)"><textarea id="ln" rows="3" placeholder="Short notes"></textarea>
 <input id="lq" placeholder="Quiz question"><input id="o0" placeholder="Option A"><input id="o1" placeholder="Option B"><input id="o2" placeholder="Option C"><input id="o3" placeholder="Option D">
 <select id="la"><option value="0">Correct: A</option><option value="1">Correct: B</option><option value="2">Correct: C</option><option value="3">Correct: D</option></select><button onclick="addL()">Add lesson</button></div>
 <div class="card"><h3>Manage my custom courses</h3>${courses.filter(c=>c.id[0]==="c").map(c=>`<p>${esc(c.title)} <span class="mu">(${c.lessons.length} lessons)</span> <button class="d" onclick="delC('${c.id}')">Delete</button></p>`).join("")}</div>`}
function addC(){const t=$("#ct").value.trim(),c=$("#cc").value.trim()||"General";if(!t)return;courses.push({id:"c"+Date.now(),title:t,cat:c,lessons:[]});sv();render()}
function addL(){const c=courses.find(c=>c.id===$("#lc").value),t=$("#lt").value.trim(),q=$("#lq").value.trim(),o=[0,1,2,3].map(i=>$("#o"+i).value.trim());
 if(!c||!t||!q||o.some(x=>!x))return alert("Fill lesson title, question and all 4 options.");
 c.lessons.push({t,v:$("#lv").value.trim()||yt(t),n:$("#ln").value.trim(),q:[{q,o,a:+$("#la").value}]});sv();render()}
function delC(id){if(confirm("Delete this course?")){courses=courses.filter(c=>c.id!==id);sv();render()}}
const FAQ=[[/course|learn|start/,"Open Courses, pick a course and tap Start on a lesson."],[/quiz|score|pass/,"Each lesson has an auto-graded quiz. Score 60% or more to pass."],[/streak/,"Finish at least one quiz each day to grow your 🔥 streak."],[/certif/,"Pass every lesson in a course, then tap Get certificate."],[/point|leader/,"You earn 10 points per correct answer. See the Leaderboard tab."],[/admin|add/,"Log in as admin to add courses and lessons."],[/python|ai|data/,"Try the Python Basics, AI Fundamentals or Data Science Starter courses!"]];
function ask(){const i=$("#ci"),t=i.value.trim();if(!t)return;const m=$("#msgs");m.innerHTML+=`<div class="m u">${esc(t)}</div>`;
 const h=FAQ.find(f=>f[0].test(t.toLowerCase()));m.innerHTML+=`<div class="m b">${h?h[1]:"I can help with courses, quizzes, streaks, points and certificates. Try asking about one!"}</div>`;i.value="";m.scrollTop=m.scrollHeight}
render();
</script></body></html>
